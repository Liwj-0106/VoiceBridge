# ============================================================
# LiveTranslate 配置文件
# ============================================================
# 此文件提供所有模块的默认配置
# 用户运行时设置保存在 user_settings.json（由控制面板自动管理）
# config.yaml 修改后需要重启应用生效

# ============================================================
# 音频捕获配置
# ============================================================
audio:
  # WASAPI loopback 设备名称
  # null = 使用系统默认输出设备（推荐）
  # 可通过控制面板运行时更改
  device: null

  # 采样率（Hz）
  # 16kHz 是 ASR 标准采样率，无需更改
  sample_rate: 16000

  # 音频块时长（秒）
  # 32ms = Silero VAD 原生窗口大小，保持最低延迟
  # 不要修改此值，除非你清楚自己在做什么
  chunk_duration: 0.032

# ============================================================
# 语音识别（ASR）配置
# ============================================================
asr:
  # Whisper 模型大小
  # tiny    (~39M)   - 最快，精度最低
  # base    (~74M)   - 快速，精度适中
  # small   (~244M)  - 中等速度，精度较好
  # medium  (~769M)  - 较慢，精度高
  # large-v3(~1550M) - 最慢，精度最高
  # 模型越大识别越准确，但也需要更多显存
  model_size: "medium"

  # 运行设备
  # cuda = 使用 GPU（推荐，需要 CUDA 环境）
  # cpu   = 使用 CPU（慢，但不需要 GPU）
  device: "cuda"

  # 计算精度（影响显存占用和速度）
  # float16      - GPU 推荐，速度快，显存适中
  # int8_float16 - 更低显存，速度稍慢
  # int8         - CPU 或显存不足时使用
  compute_type: "float16"

  # ASR 识别语言
  # auto = 自动检测（推荐）
  # 也可指定：en, ja, zh, ko, fr, de 等
  language: "auto"

  # 最小语音时长（秒）
  # 短于此时长的音频段会被丢弃（过滤静音/噪声）
  min_speech_duration: 1.0

  # 最大语音时长（秒）
  # 超过此时长强制切分（防止一句话太长）
  max_speech_duration: 8.0

  # VAD 语音活动检测阈值 (0.0 ~ 1.0)
  # 0.5 = 默认值，越高越敏感（检测更多但可能误检）
  # 0.3~0.7 是合理范围
  vad_threshold: 0.5

# ============================================================
# 翻译配置
# ============================================================
translation:
  # OpenAI 兼容 API 地址
  # 支持 DeepSeek、Grok、Qwen、GPT、Ollama、vLLM 等
  api_base: "http://127.0.0.1:1234/v1"

  # API 密钥
  api_key: "sk-lm-tHzDfNGm:dgxlip7eebn3HIMxivqN"

  # 模型名称（根据你的 API 提供商填写）
  model: "hunyuan-mt-chimera-7b"

  # 目标语言
  # zh  = 中文
  # ja  = 日语
  # en  = 英语
  # ko  = 韩语
  # 等（见 LANGUAGES 列表）
  target_language: "zh"

  # 源语言提示
  # auto = 由 ASR 自动检测（推荐）
  # 也可手动指定：ja, en 等
  source_language: "auto"

  # 上下文窗口大小
  # 包含最近 N 轮翻译作为上下文，减少歧义
  # 设为 0 则不包含上下文
  context_window: 10

  # 翻译响应最大 Token 数
  # 控制单次翻译的最大长度
  max_tokens: 256

  # 采样温度 (0.0 ~ 1.0)
  # 越低 = 越确定性，输出更稳定
  # 越高 = 更多随机性，输出更多样
  # 翻译推荐 0.3 左右
  temperature: 0.3

  # 启用流式输出
  # true = 逐字显示翻译结果（推荐，开启）
  # false = 等翻译完成后再显示
  streaming: true

  # 系统提示词模板
  # 变量：
  #   {source_lang} - 源语言（如"日语"、"英语"）
  #   {target_lang} - 目标语言（如"中文"）
  #   {context}     - 近期对话上下文
  # 注意：此模板在 user_settings.json 中可被用户覆盖
  system_prompt: |
    你是一个专业的影视字幕翻译专家。请将以下{source_lang}对话翻译为{target_lang}。
    要求：
    1. 保持口语化，符合目标语言观众的表达习惯
    2. 简洁明了，每句翻译不超过原文两行
    3. 如果语句不完整，结合上下文补全含义
    4. 不要添加解释或注释，只输出翻译结果

    近期对话上下文：
    {context}

# ============================================================
# 字幕显示配置
# ============================================================
subtitle:
  # 翻译字体
  font_family: "Microsoft YaHei"

  # 翻译字体大小
  font_size: 28

  # 翻译文字颜色（十六进制）
  # #FFFFFF = 白色
  # #FFFF00 = 黄色
  font_color: "#FFFFFF"

  # 描边颜色
  # 用于在复杂背景下增加可读性
  outline_color: "#000000"

  # 描边宽度（像素）
  outline_width: 2

  # 字幕距屏幕底部距离（像素）
  bottom_margin: 80

  # 显示原文
  # true = 原文显示在翻译上方
  # false = 只显示翻译
  show_original: true

  # 原文字体大小
  original_font_size: 20

  # 原文文字颜色
  original_color: "#CCCCCC"

  # 字幕显示时长（秒）
  # 字幕显示后经过此时长自动隐藏
  display_duration: 5.0

  # 窗口透明度 (0.0 ~ 1.0)
  # 1.0 = 完全不透明
  # 0.95 = 略微透明
  opacity: 0.95
